  <style>
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap');

* { box-sizing: border-box; }

html, body {

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

}

  <audio id="bg-music" src="musique-fond.mp3" loop preload="auto"></audio>

  <script>
(function () {
  "use strict";

  var CLASSES = [
    { id: "cp1", label: "CP1", group: "Primaire" },
    { id: "cp2", label: "CP2", group: "Primaire" },
    { id: "ce1", label: "CE1", group: "Primaire" },
    { id: "ce2", label: "CE2", group: "Primaire" },
    { id: "cm1", label: "CM1", group: "Primaire" },
    { id: "cm2", label: "CM2", group: "Primaire" },
    { id: "sixieme", label: "6ème", group: "Collège" },
    { id: "cinquieme", label: "5ème", group: "Collège" },
    { id: "quatrieme", label: "4ème", group: "Collège" },
    { id: "troisieme", label: "3ème", group: "Collège" },
    { id: "seconde", label: "2nde", group: "Lycée" },
    { id: "premiere", label: "1ère", group: "Lycée" },
    { id: "terminaleA", label: "Terminale A", group: "Lycée" },
    { id: "terminaleD", label: "Terminale D", group: "Lycée" },
    { id: "terminaleC", label: "Terminale C", group: "Lycée" },
  ];
  var GROUPS = ["Primaire", "Collège", "Lycée"];
  var LEVELS_PER_GROUP = {
    "Primaire": 5,
    "Collège": 10,
    "Lycée": 10,
  };
  var MAX_Q = 20;
  var STORAGE_KEY = "craie-maths-data";

  // Mot de passe pour accéder à l'ajout de questions.
  // Pour le changer : remplace le texte entre guillemets ci-dessous,
  // enregistre le fichier, puis remets-le en ligne sur GitHub.
  var ADMIN_PASSWORD = "05112001";

  function classGroup(classId) {
    var c = CLASSES.filter(function (x) {
      return x.id === classId;
    })[0];
    return c ? c.group : "Primaire";
  }

  function getLevelsForClass(classId) {
    var n = LEVELS_PER_GROUP[classGroup(classId)] || 5;
    var arr = [];
    for (var i = 1; i <= n; i++) arr.push(i);
    return arr;
  }

  function emptyData() {
    var d = {};
    CLASSES.forEach(function (c) {
      d[c.id] = {};
      getLevelsForClass(c.id).forEach(function (l) {
        d[c.id][l] = [];
      });
    });
    return d;
  }

  function seedData() {
    var d = emptyData();
    d.cp1[1] = [
      { id: "seed1", type: "qcm", text: "Combien font 2 + 3 ?", choices: ["4", "5", "6", "3"], answer: "5" },
      { id: "seed2", type: "qcm", text: "Combien font 4 + 1 ?", choices: ["6", "5", "4", "3"], answer: "5" },
    ];
    d.terminaleC[1] = [{ id: "seed3", type: "libre", text: "Quelle est la dérivée de x² ?", answer: "2x" }];
    return d;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function normalize(s) {
    return String(s).trim().toLowerCase().replace(/\s+/g, "").replace(",", ".");
  }

  function isCorrectAnswer(question, userValue) {
    if (question.type === "qcm") return userValue === question.answer;
    var u = normalize(userValue);
    var a = normalize(question.answer);
    if (u === a) return true;
    var uf = parseFloat(u);
    var af = parseFloat(a);
    if (!isNaN(uf) && !isNaN(af)) return Math.abs(uf - af) < 1e-9;
    return false;
  }

  function classLabel(id) {
    var c = CLASSES.filter(function (x) {
      return x.id === id;
    })[0];
    return c ? c.label : id;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // ---------------------------------------------------------------------
  // Sons (générés, sans fichier audio : fonctionnent hors-ligne)
  // ---------------------------------------------------------------------
  var audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function isSoundOn() {
    return state.soundOn !== false;
  }

  function speak(text) {
    if (!isSoundOn()) return;
    if (!("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      u.rate = 1;
      u.pitch = 1;
      window.speechSynthesis.speak(u);
    } catch (e) {
      console.error("Voix indisponible", e);
    }
  }

  function playTone(freqs, opts) {
    if (!isSoundOn()) return;
    var ctx = getAudioCtx();
    if (!ctx) return;
    opts = opts || {};
    var noteDur = opts.noteDur || 0.16;
    var type = opts.type || "sine";
    var gainVal = opts.gain || 0.18;
    var t = ctx.currentTime;
    freqs.forEach(function (f) {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(gainVal, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + noteDur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + noteDur + 0.02);
      t += noteDur * 0.85;
    });
  }

  function playCorrectSound() {
    playTone([523.25, 659.25, 783.99], { noteDur: 0.14, type: "triangle", gain: 0.2 });
    speak("Bonne réponse !");
  }

  function playWrongSound() {
    playTone([392, 311.13], { noteDur: 0.22, type: "sawtooth", gain: 0.15 });
    speak("Mauvaise réponse !");
  }

  function playApplause() {
    if (!isSoundOn()) return;
    var ctx = getAudioCtx();
    if (ctx) {
      var duration = 1.6;
      var bufferSize = ctx.sampleRate * duration;
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      // Bruit blanc modulé par des rafales aléatoires pour imiter des applaudissements
      for (var i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.5;
      }
      var clapTimes = [];
      var nClaps = 22;
      for (var c = 0; c < nClaps; c++) {
        clapTimes.push(Math.random() * (duration - 0.1));
      }
      var envelope = new Float32Array(bufferSize);
      clapTimes.forEach(function (ct) {
        var start = Math.floor(ct * ctx.sampleRate);
        var len = Math.floor(0.03 * ctx.sampleRate);
        for (var j = 0; j < len && start + j < bufferSize; j++) {
          var e = Math.exp(-j / (len * 0.25));
          envelope[start + j] = Math.max(envelope[start + j], e);
        }
      });
      for (var k = 0; k < bufferSize; k++) {
        data[k] *= envelope[k];
      }

      var src = ctx.createBufferSource();
      src.buffer = buffer;
      var filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 2200;
      filter.Q.value = 0.7;
      var gain = ctx.createGain();
      gain.gain.value = 0.9;
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start();
    }
    speak("Bravo ! Niveau réussi sans faute !");
  }

  // ---------------------------------------------------------------------
  // Musique de fond (fichier audio fourni : "Che Che Kule", en boucle pendant le quiz)
  // ---------------------------------------------------------------------
  var bgMusicEl = null;
  function getMusicEl() {
    if (!bgMusicEl) bgMusicEl = document.getElementById("bg-music");
    return bgMusicEl;
  }

  function startBackgroundMusic() {
    if (!isSoundOn()) return;
    var el = getMusicEl();
    if (!el) return;
    el.volume = 0.45;
    el.currentTime = 0;
    var p = el.play();
    if (p && p.catch) p.catch(function (e) { console.error("Lecture musique impossible", e); });
  }

  function stopBackgroundMusic() {
    var el = getMusicEl();
    if (!el) return;
    el.pause();
    el.currentTime = 0;
  }

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  var state = {
    data: null,
    screen: "home",
    selClass: null,
    selLevel: null,
    quizQs: [],
    idx: 0,
    score: 0,
    choiceOrderCache: {},
    selectedChoice: null,
    submitted: false,
    wasCorrect: false,
    qType: "qcm",
    correctIdx: 0,
    formError: "",
    isAdminAuthed: false,
    loginError: "",
    soundOn: true,
    pendingAdminScreen: "admin-class",
    timeLeft: 20,
    maxTime: 20,
    timerInterval: null,
    timedOut: false,
    scores: {},
  };

  // ---------------------------------------------------------------------
  // Chronomètre par question (le temps dépend du groupe de la classe)
  // ---------------------------------------------------------------------
  var GROUP_TIME = {
    "Primaire": 20,
    "Collège": 45,
    "Lycée": 60,
  };

  function getTimeForClass(classId) {
    return GROUP_TIME[classGroup(classId)] || 20;
  }

  function clearQuestionTimer() {
    if (state.timerInterval) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
  }

  function updateTimerDisplay() {
    var valEl = document.getElementById("timer-value");
    if (valEl) valEl.textContent = state.timeLeft;
    var fillEl = document.getElementById("timer-bar-fill");
    if (fillEl) {
      var pct = Math.max(0, (state.timeLeft / state.maxTime) * 100);
      fillEl.style.width = pct + "%";
      fillEl.style.background = state.timeLeft <= 5 ? "#ff8f8f" : "#f4d35e";
    }
  }

  function startQuestionTimer() {
    clearQuestionTimer();
    state.maxTime = getTimeForClass(state.selClass);
    state.timeLeft = state.maxTime;
    state.timedOut = false;
    updateTimerDisplay();
    state.timerInterval = setInterval(function () {
      state.timeLeft -= 1;
      updateTimerDisplay();
      if (state.timeLeft <= 0) {
        clearQuestionTimer();
        handleTimeUp();
      }
    }, 1000);
  }

  function handleTimeUp() {
    if (state.submitted) return;
    state.wasCorrect = false;
    state.submitted = true;
    state.timedOut = true;
    render();
    playTimeUpSound();
  }

  function playTimeUpSound() {
    playTone([392, 311.13], { noteDur: 0.22, type: "sawtooth", gain: 0.15 });
    speak("Temps écoulé !");
  }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        state.data = JSON.parse(raw);
        migrateData();
        return;
      }
    } catch (e) {
      console.error("Lecture du stockage impossible", e);
    }
    state.data = seedData();
    saveData();
  }

  // Ajoute les nouveaux niveaux (ex: 6 à 10 pour Collège/Lycée) aux données
  // déjà sauvegardées par un utilisateur, sans toucher aux questions existantes.
  function migrateData() {
    var changed = false;
    if (!state.data) {
      state.data = emptyData();
      changed = true;
    }
    // Ancienne classe unique "Terminale" -> fusionnée dans "Terminale C"
    // (conserve les questions déjà ajoutées avant la séparation en séries A/D/C)
    if (state.data.terminale) {
      if (!state.data.terminaleC) state.data.terminaleC = {};
      Object.keys(state.data.terminale).forEach(function (lvl) {
        var oldQs = state.data.terminale[lvl] || [];
        var existing = state.data.terminaleC[lvl] || [];
        state.data.terminaleC[lvl] = existing.concat(oldQs);
      });
      delete state.data.terminale;
      changed = true;
    }
    CLASSES.forEach(function (c) {
      if (!state.data[c.id]) {
        state.data[c.id] = {};
        changed = true;
      }
      getLevelsForClass(c.id).forEach(function (l) {
        if (!state.data[c.id][l]) {
          state.data[c.id][l] = [];
          changed = true;
        }
      });
    });
    if (changed) saveData();
  }

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
    } catch (e) {
      console.error("Sauvegarde impossible", e);
    }
  }

  function getPlayerName() {

    }

  function saveScores() {
    try {

  }

  function recordScore(classId, level, name, score, total) {
    if (!state.scores[classId]) state.scores[classId] = {};
    if (!state.scores[classId][level]) state.scores[classId][level] = [];
    state.scores[classId][level].push({
      name: (name || "Joueur").trim() || "Joueur",
      score: score,
      total: total,
      date: new Date().toISOString(),
    });
    state.scores[classId][level].sort(function (a, b) {
      var pa = a.total ? a.score / a.total : 0;
      var pb = b.total ? b.score / b.total : 0;
      if (pb !== pa) return pb - pa;
      return new Date(a.date) - new Date(b.date);
    });
    state.scores[classId][level] = state.scores[classId][level].slice(0, MAX_SCORES_PER_LEVEL);
    saveScores();
  }

  // ---------------------------------------------------------------------
  // Actions
  // ---------------------------------------------------------------------
  function goHome() {
    state.screen = "home";
    state.selClass = null;
    state.selLevel = null;
    render();
  }

  function submitAdminLogin() {
    var el = document.getElementById("admin-password");
    var val = el ? el.value : "";
    if (val === ADMIN_PASSWORD) {
      state.isAdminAuthed = true;
      state.loginError = "";
      state.screen = state.pendingAdminScreen || "admin-class";
    } else {
      state.loginError = "Mot de passe incorrect.";
    }
    render();
  }

  function pickLevelForPlay(lvl) {
    stopBackgroundMusic();
    clearQuestionTimer();
    var qs = state.data[state.selClass][lvl];
    if (!qs || qs.length === 0) {
      state.selLevel = lvl;
      state.screen = "play-empty";
      render();
      return;
    }
    var chosen = shuffle(qs).slice(0, MAX_Q);
    state.quizQs = chosen;
    state.selLevel = lvl;
    state.idx = 0;
    state.score = 0;
    state.selectedChoice = null;
    state.submitted = false;
    var cache = {};
    chosen.forEach(function (q) {
      if (q.type === "qcm") cache[q.id] = shuffle(q.choices);
    });
    state.choiceOrderCache = cache;
    state.screen = "play-quiz";
    render();
    startBackgroundMusic();
    startQuestionTimer();
  }

  function submitAnswer() {
    var q = state.quizQs[state.idx];
    var userVal;
    if (q.type === "qcm") {
      userVal = state.selectedChoice;
    } else {
      var inp = document.getElementById("quiz-input");
      userVal = inp ? inp.value : "";
    }
    if (userVal === null || userVal === undefined || String(userVal).trim() === "") return;
    clearQuestionTimer();
    var ok = isCorrectAnswer(q, userVal);
    state.wasCorrect = ok;
    state.timedOut = false;
    if (ok) state.score += 1;
    state.submitted = true;
    render();
    if (ok) playCorrectSound();
    else playWrongSound();
  }

  function nextQuestion() {
    if (state.idx + 1 >= state.quizQs.length) {
      stopBackgroundMusic();
      clearQuestionTimer();
      recordScore(state.selClass, state.selLevel, getPlayerName(), state.score, state.quizQs.length);
      state.screen = "play-result";
      render();
      if (state.score === state.quizQs.length && state.quizQs.length > 0) {
        setTimeout(playApplause, 300);
      }
      return;
    }
    state.idx += 1;
    state.selectedChoice = null;
    state.submitted = false;
    render();
    startQuestionTimer();
  }

  function addQuestion() {
    state.formError = "";
    var qTextEl = document.getElementById("q-text");
    var qText = qTextEl ? qTextEl.value.trim() : "";
    if (!qText) {
      state.formError = "Écris d'abord l'énoncé de la question.";
      render();
      return;
    }
    var newQ;
    if (state.qType === "qcm") {
      var choiceVals = [];
      for (var i = 0; i < 4; i++) {
        var el = document.getElementById("choice-input-" + i);
        choiceVals.push(el ? el.value.trim() : "");
      }
      if (choiceVals.some(function (c) { return !c; })) {
        state.formError = "Remplis les 4 propositions.";
        render();
        return;
      }
      newQ = {
        id: "q_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        type: "qcm",
        text: qText,
        choices: choiceVals,
        answer: choiceVals[state.correctIdx],
      };
    } else {
      var libreEl = document.getElementById("libre-answer");
      var libreAnswer = libreEl ? libreEl.value.trim() : "";
      if (!libreAnswer) {
        state.formError = "Indique la bonne réponse.";
        render();
        return;
      }
      newQ = {
        id: "q_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
        type: "libre",
        text: qText,
        answer: libreAnswer,
      };
    }
    state.data[state.selClass][state.selLevel].push(newQ);
    saveData();
    state.correctIdx = 0;
    state.formError = "";
    render();
  }

  function deleteQuestion(id) {
    var arr = state.data[state.selClass][state.selLevel];
    state.data[state.selClass][state.selLevel] = arr.filter(function (q) {
      return q.id !== id;
    });
    saveData();
    render();
  }

  // ---------------------------------------------------------------------
  // Event delegation
  // ---------------------------------------------------------------------
  function attachListeners() {
    board.querySelectorAll("[data-action]").forEach(function (el) {
      el.addEventListener("click", function () {
        var action = el.getAttribute("data-action");
        switch (action) {
          case "go-home":
            goHome();
            break;
          case "go-play-class":
            state.screen = "play-class";
            render();
            break;
          case "go-admin-class":
            state.screen = "admin-class";
            render();
            break;
          case "pick-class":
            state.selClass = el.getAttribute("data-class");
            state.screen = el.getAttribute("data-mode") === "play" ? "play-level" : "admin-level";
            render();
            break;
          case "pick-level":
            var lvl = parseInt(el.getAttribute("data-level"), 10);
            if (el.getAttribute("data-mode") === "play") {
              pickLevelForPlay(lvl);
            } else {
              state.selLevel = lvl;
              state.qType = "qcm";
              state.correctIdx = 0;
              state.formError = "";
              state.screen = "admin-manage";
              render();
            }
            break;
          case "go-play-level":
            state.screen = "play-level";
            render();
            break;
          case "go-admin-level":
            state.screen = "admin-level";
            render();
            break;
          case "go-admin-manage-from-empty":
            state.qType = "qcm";
            state.correctIdx = 0;
            state.formError = "";
            state.pendingAdminScreen = "admin-manage";
            state.screen = state.isAdminAuthed ? "admin-manage" : "admin-login";
            render();
            break;
          case "go-admin-login":
            state.loginError = "";
            state.pendingAdminScreen = "admin-class";
            state.screen = "admin-login";
            render();
            break;
          case "admin-login-submit":
            submitAdminLogin();
            break;
          case "select-choice":
            state.selectedChoice = el.getAttribute("data-value");
            render();
            break;
          case "submit-answer":
            submitAnswer();
            break;
          case "next-question":
            nextQuestion();
            break;
          case "replay-level":
            pickLevelForPlay(state.selLevel);
            break;
          case "go-leaderboard":
            state.screen = "play-leaderboard";
            render();
            break;
          case "back-to-result":
            state.screen = "play-result";
            render();
            break;
          case "set-qtype":
            state.qType = el.getAttribute("data-value");
            state.formError = "";
            render();
            break;
          case "add-question":
            addQuestion();
            break;
          case "delete-question":
            deleteQuestion(el.getAttribute("data-id"));
            break;
        }
      });
    });

    board.querySelectorAll('[data-action="set-correct-idx"]').forEach(function (el) {
      el.addEventListener("change", function () {
        state.correctIdx = parseInt(el.value, 10);
        render();
      });
    });

    // Enter key submits the free-text quiz answer
    var quizInput = document.getElementById("quiz-input");
    if (quizInput) {
      quizInput.focus();
      quizInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !state.submitted) submitAnswer();
      });
    }

    // Enter key submits the admin password
    var pwInput = document.getElementById("admin-password");
    if (pwInput) {
      pwInput.focus();
      pwInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") submitAdminLogin();
      });
    }

    // Sauvegarde le prénom du joueur au fil de la frappe (écran d'accueil)
    var nameInput = document.getElementById("player-name");
    if (nameInput) {
      nameInput.addEventListener("input", function () {
        savePlayerName(nameInput.value);
      });
    }
  }

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  document.addEventListener("DOMContentLoaded", function () {
    loadData();
    loadSoundPref();
    loadScores();
    render();

    var soundBtn = document.getElementById("sound-toggle");
    if (soundBtn) {
      soundBtn.textContent = state.soundOn ? "🔊" : "🔇";
      soundBtn.addEventListener("click", toggleSound);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (err) {
          console.error("Service worker non enregistré", err);
        });
      });
    }
  });
})();

</script>
</body>
</html>
